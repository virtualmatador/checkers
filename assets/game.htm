<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="game.css">
    <script src="game.js"></script>
    <title>Checkers</title>
</head>

<body>
    <div></div>
    <div id="header">
        <div id="control">
            <div id="message" data-show="0"></div>
            <div id="go" data-show="0" onclick="go()"></div>
            <div id="gameover" data-show="0"></div>
        </div>
        <div id="side">
            <div>Your Pieces:</div>
            <span id="side-piece" role="img" aria-label="Light piece"></span>
            <div>Your Moves:</div>
            <img id="side-direction">
        </div>
        <div class="top-actions">
            <button class="back" type="button" aria-label="Back to menu" title="Back to menu"
                onclick="stop()">&#10005;</button>
        </div>
    </div>
    <div>
        <div id="board">
        </div>
    </div>
    <div style="order: 2;"></div>
</body>

</html>
